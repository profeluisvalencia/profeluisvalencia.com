<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico PH 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--base:#0D0814;--neon:#BDFF00;--azul:#0066FF;--blanco:#FFFFFF;--g1:#888899;--g2:#AAAABC;--rojo:#E5202F;--amar:#D9A400;--nar:#F06A00;
 --bg:#F3F3F6;--card:#FFFFFF;--line:#E2E2EA;--txt:#0D0814;--muted:#5C5C70;--soft:#F7F7FA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:19px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:22px 20px 40px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,.bebas{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.5px;line-height:1.02}
h1{font-size:56px}
h2{font-size:40px;margin-bottom:10px}
/* resaltador verde (plumón) sobre claro; texto neón dentro de bloques oscuros */
.neon{color:var(--txt);background:linear-gradient(transparent 52%,var(--neon) 52%,var(--neon) 92%,transparent 92%);padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.big.neon{background:none;color:var(--azul);padding:0}
.money .full .neon{color:var(--neon);background:none;padding:0}
.neon.full{background:var(--neon);padding:0 6px;white-space:nowrap;display:inline-block}
.dark .neon{color:var(--neon);background:none;padding:0}
.azul{color:var(--azul)}.gris{color:var(--muted)}
.small{font-size:15px;color:var(--muted)}
.brand{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--azul);font-weight:700;margin-bottom:18px}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.progress>div{height:100%;background:var(--azul);transition:width .3s}
.step{font-size:14px;color:var(--muted);margin-bottom:18px}
.q{font-size:27px;font-weight:700;line-height:1.25;margin-bottom:8px}
.hint{font-size:16px;color:var(--muted);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--txt);font:inherit;font-size:20px;padding:17px 18px;border-radius:14px;cursor:pointer;box-shadow:0 1px 3px rgba(13,8,20,.05)}
.opt:active,.opt.sel{border-color:var(--azul);background:#EEF4FF;box-shadow:inset 6px 0 0 var(--neon)}
select,input[type=number],input[type=text],input[type=tel]{width:100%;font:inherit;font-size:22px;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt)}
select:focus,input:focus{outline:none;border-color:var(--azul)}
label.chk{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:18px;color:var(--muted);cursor:pointer}
label.chk input{width:26px;height:26px;accent-color:var(--azul);flex:none;margin-top:2px}
.btn{display:block;width:100%;text-align:center;border:none;font:inherit;font-weight:700;font-size:21px;padding:19px;border-radius:16px;background:var(--base);color:var(--neon);cursor:pointer;margin-top:22px;text-decoration:none}
.dark .btn,.btn.verde{background:var(--neon);color:var(--base)}
.btn[disabled]{opacity:.3}
.btn.sec{background:transparent;color:var(--muted);border:2px solid var(--line);font-weight:500;font-size:17px;padding:13px;margin-top:12px}
.back{background:none;border:none;color:var(--muted);font:inherit;font-size:16px;margin-bottom:10px;cursor:pointer;align-self:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 4px 18px rgba(13,8,20,.06)}
.big{font-family:'Bebas Neue';font-size:80px;line-height:.95}
.zone{border-radius:18px;padding:20px;margin-top:16px;background:var(--card);box-shadow:0 4px 18px rgba(13,8,20,.06)}
.zone.roja{background:#FFF0F1;border:2px solid var(--rojo)}.zone.roja .bebas:first-child{color:var(--rojo)}
.zone.amar{background:#FFF8E1;border:2px solid var(--amar)}.zone.amar .bebas:first-child{color:#9A7300}
.zone.nar{background:#FFF2E8;border:2px solid var(--nar)}.zone.nar .bebas:first-child{color:#C25500}
.zone.verde{background:#F6FFE0;border:2px solid #8DC000}.zone.verde .bebas:first-child{color:#4F7000}
.bar{margin:12px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:16px;margin-bottom:5px}
.bar .tr{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar .fl{height:100%;border-radius:8px;background:var(--azul)}
.bar.ex .fl{background:var(--neon);box-shadow:inset 0 0 0 1px #9CD000}
table{width:100%;border-collapse:collapse;font-size:18px;margin-top:8px}
td{padding:11px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
tr.meta td{background:var(--neon);font-weight:700}
tr.meta td:first-child{border-radius:8px 0 0 8px;padding-left:10px}tr.meta td:last-child{border-radius:0 8px 8px 0;padding-right:10px}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.money div{background:var(--soft);border-radius:12px;padding:12px;border:1px solid var(--line)}
.money b{font-family:'Bebas Neue';font-size:36px;font-weight:400;display:block}
.money .full{grid-column:1/-1;background:var(--base);color:#fff;border:none}.money .full .small{color:var(--g2)}.money .full b{color:var(--neon)}
.note{border-left:5px solid var(--azul);padding:14px 16px;background:#EEF4FF;border-radius:10px;margin-top:16px;font-size:17px}
.legal{font-size:13px;color:var(--muted);margin-top:18px}
.err{color:var(--rojo);font-size:16px;margin-top:8px;min-height:20px}
.center{text-align:center}
.modal{position:fixed;inset:0;background:rgba(13,8,20,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mbox{background:var(--card);border-top:6px solid var(--neon);border-radius:20px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.prob{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center}
.pr{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:4px}
.pr b{font-family:'Bebas Neue';font-weight:400;font-size:54px;display:block;line-height:1}.pr span{font-size:13px;color:var(--muted)}.pr .arr{font-size:30px;color:var(--azul)}
.sector{background:var(--soft);border-radius:14px;padding:14px 16px;margin:12px 0 4px;border:1px solid var(--line)}
.zone .sector,.zone .prob{background:rgba(255,255,255,.75)}
/* bloques oscuros: oferta y carga */
.dark{--txt:#FFFFFF}
.offer{margin-top:22px;border-radius:22px;padding:22px 20px;background:var(--base);color:#fff;border:3px solid var(--neon);box-shadow:0 10px 40px rgba(13,8,20,.25)}
.offer .gris,.offer .small{color:var(--g2)}
.otop{display:inline-block;background:var(--neon);color:var(--base);font-weight:700;font-size:13px;letter-spacing:1px;padding:5px 10px;border-radius:8px}
.offer h2{font-size:60px;margin-top:10px;color:#fff}
.cd{margin-top:16px;background:#1A1324;border-radius:14px;padding:12px 14px;text-align:center}
.cdn{display:flex;justify-content:center;gap:10px;margin-top:6px}
.cdn div{min-width:62px}.cdn b{font-family:'Bebas Neue';font-weight:400;font-size:44px;display:block;color:var(--neon);line-height:1}.cdn span{font-size:12px;color:var(--g2)}
.offer ul{list-style:none;margin-top:10px}
.offer li{padding:6px 0 6px 28px;position:relative;font-size:18px}
.offer li:before{content:"✓";position:absolute;left:0;color:var(--neon);font-weight:700}
.price{margin-top:10px}.price s{color:var(--g1)}
</style>

function antig(y){ if(y>=30) return 35; if(y<2) return 0;
  const seg=[[2,8,10,15.35],[9,19,16.25,25.17],[20,29,26.07,34.10]];
  for(const [a,b,pa,pb] of seg){ if(y>=a&&y<=b) return pa+(pb-pa)*(y-a)/(b-a); } return 10; }
function actual(h){ if(h<20) return 0; if(h>=200) return 20;
  const seg=[[20,50,5,7.5],[51,100,7.58,11.66],[101,150,11.75,15.83],[151,200,15.91,20]];

function grupo(){ const g=NIVELES[A.nivel]; return FUNC_DIR.includes(A.funcion) ? (g===3?5:4) : g; }
function fila(){
  const g=grupo(); const est=A.estado; const so=A.sosten;
  const ok=r=>r[3]>=30;
  let rows=DATA.filter(r=>r[0]===est&&r[2]===g&&ok(r));
  let r= rows.find(x=> so==="Estatal" ? x[1]==="Estatal" : x[1]!=="Estatal") || rows[0];
  if(r) return {r, local:true};
  const all=DATA.filter(x=>x[2]===g&&ok(x)); const n=all.reduce((s,x)=>s+x[3],0);
  const avg=[ "NACIONAL","",g,n ]; for(let i=4;i<13;i++) avg.push(all.reduce((s,x)=>s+x[i]*x[3],0)/n);
  return {r:avg, local:false};
}
function pctKey(p){ return {5:6,10:7,20:8,30:9,50:10,70:11,90:12}[p]; }
function topPct(score,r){ // % de participantes que quedan ARRIBA de ese puntaje
  const pts=[[0,r[4]],[5,r[6]],[10,r[7]],[20,r[8]],[30,r[9]],[50,r[10]],[70,r[11]],[90,r[12]],[100,r[5]]];
  if(score>=pts[0][1]) return 0; if(score<=pts[8][1]) return 100;
  for(let i=0;i<8;i++){ const [pa,sa]=pts[i],[pb,sb]=pts[i+1]; if(score<=sa&&score>=sb){ return sa===sb?pa:pa+(pb-pa)*(sa-score)/(sa-sb);} } return 50; }
function calc(){
  const fA=antig(A.anios), fF=Math.min(15,CONFIG.formacion[A.grado]+(A.normal?CONFIG.bonoNormalBasica:0)), fC=actual(A.horas), fE=A.incentivo?0:CONFIG.pesos.equidad;
  const fijos=fA+fF+fC+fE; const pa=CONFIG.pesos.examen/CONFIG.reactivos;
  const hoyAc = A.previo!=null ? A.previo+Math.max(-10,Math.min(3,A.auto-A.previo)) : (A.part ? Math.min(65,A.auto) : A.auto); const hoyEx=hoyAc*pa;
  const {r,local}=fila();
  const meta=r[pctKey(CONFIG.metaPercentil)], meta2=r[pctKey(CONFIG.metaSegundaPercentil)];
  const need=m=>Math.ceil((m-fijos)/pa);
  const n1=need(meta), n2=need(meta2);
  const tot=a=>Math.min(CONFIG.pesos.tope,fijos+a*pa);
  const sup=a=>Math.max(0,Math.min(100,100-topPct(tot(a),r)));
  const pctInc=A.marg?CONFIG.incentivo.marginacion:CONFIG.incentivo.normal; const mes=A.sueldo*pctInc;
  return {fA,fF,fC,fE,fijos,hoyAc,hoyEx,r,local,meta,meta2,n1,n2,tot,sup,mes,pctInc};
}
