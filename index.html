<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profe Luis Valencia</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #f5f5f5;
      --green: #BDFF00;
    }

    html, body {
      height: 100%;
      background-color: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      border: 1px solid var(--green);
      color: var(--green);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: var(--white);
      margin-bottom: 0.5rem;
    }

    h1 span {
      color: var(--green);
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      color: rgba(245,245,245,0.55);
      max-width: 38ch;
      margin: 1.8rem auto 0;
      line-height: 1.65;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--green);
      margin: 2.5rem auto;
    }

    .footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.78rem;
      color: rgba(245,245,245,0.25);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <span class="badge">Sitio oficial</span>

  <h1>Profe<br><span>Luis Valencia</span></h1>

  <div class="divider"></div>

  <p class="subtitle">
    Este sitio está en construcción.<br>
    Próximamente tendremos un anuncio importante para ti.
  </p>

  <p class="footer">profeluisvalencia.com &nbsp;·&nbsp; © 2026</p>

</body>
</html>
